<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序列记忆游戏</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>序列记忆游戏</h1>
            <div class="game-info">
                <span class="score">得分: <span id="score">0</span></span>
                <span class="level">等级: <span id="level">简单</span></span>
                <span class="streak">连击: <span id="streak">0</span></span>
            </div>
        </header>

        <div class="game-board">
            <div class="difficulty-selector" id="difficultySelector">
                <button class="difficulty-btn" data-difficulty="easy">简单模式</button>
                <button class="difficulty-btn" data-difficulty="medium">一般模式</button>
                <button class="difficulty-btn" data-difficulty="hard">困难模式</button>
            </div>

            <div class="number-grid" id="numberGrid"></div>

            <div class="controls">
                <button id="startButton" class="control-btn">开始游戏</button>
                <button id="hintButton" class="control-btn" disabled>提示 (3)</button>
            </div>
        </div>

        <div class="stats">
            <div class="best-score">最高分: <span id="bestScore">0</span></div>
            <div class="accuracy">正确率: <span id="accuracy">0%</span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
