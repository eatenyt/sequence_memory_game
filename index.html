<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序列记忆游戏</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>
    <!-- 首页 -->
    <div class="home-container" id="homePage">
        <h1>序列记忆游戏</h1>
        <div class="menu-buttons">
            <button class="menu-btn" id="easyButton">简单模式</button>
            <button class="menu-btn" id="mediumButton">一般模式</button>
            <button class="menu-btn" id="hardButton">困难模式</button>
            <button class="menu-btn" id="instructionsButton">游戏说明</button>
        </div>
    </div>

    <!-- 游戏页面 -->
    <div class="game-container" id="gamePage" style="display: none;">
        <button class="back-btn" onclick="backToHome()">返回首页</button>
        <header>
            <h1>序列记忆游戏</h1>
            <div class="game-info">
                <span class="score">得分: <span id="score">0</span></span>
                <span class="streak">连击: <span id="streak">0</span></span>
                <span class="timer">时间: <span id="timer">60</span>秒</span>
            </div>
        </header>

        <div class="game-board">
            <div class="number-grid" id="gameGrid"></div>
            <div class="controls">
                <button id="startButton" class="control-btn">开始游戏</button>
            </div>
        </div>
    </div>

    <!-- 游戏说明页面 -->
    <div class="instructions-container" id="instructionsPage" style="display: none;">
        <button class="back-btn" onclick="backToHome()">返回首页</button>
        <h1>游戏说明</h1>
        <div class="instructions-content">
            <h2>游戏规则：</h2>
            <ul>
                <li>观察数字序列：数字会按特定顺序依次高亮显示</li>
                <li>记忆并重复：按照相同顺序点击数字</li>
                <li>计分规则：每完成一次序列获得相应分数</li>
                <li>连击奖励：连续答对可获得额外分数</li>
                <li>答错处理：答错会直接进入下一题</li>
                <li>时间限制：每局游戏时间为60秒</li>
            </ul>
            <h2>难度说明：</h2>
            <ul>
                <li>简单模式：4个数字，1-6范围，2×3网格</li>
                <li>一般模式：6个数字，1-9范围，3×3网格</li>
                <li>困难模式：9个数字，1-9范围，3×3网格</li>
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
